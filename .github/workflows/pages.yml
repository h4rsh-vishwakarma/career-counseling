name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build React frontend
        run: |
          npm ci --prefix frontend
          BASE_PATH=/career-counseling/ npm run build --prefix frontend
          find frontend -maxdepth 1 -name '*.html' ! -name 'index.html' -exec cp {} frontend/dist/ \;
          cp -r frontend/css frontend/js frontend/dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4

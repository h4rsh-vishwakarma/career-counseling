name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for .env file (should not be committed)
        run: |
          if [ -f .env ]; then
            echo "ERROR: backend/.env must not be committed to the repository"
            exit 1
          fi
          echo ".env check passed"

      - name: Run tests
        run: npm test

      - name: Validate frontend files
        working-directory: .
        run: |
          test -f frontend/index.html
          test -f frontend/js/config.js
          ! grep -R 'const API_BASE = "http://localhost:5000"' frontend/js
